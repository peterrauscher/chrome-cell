services:
  chrome-cell:
    build: .
    image: ghcr.io/peterrauscher/chrome-cell:local
    hostname: chrome-cell
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
    ports:
      - "3001:3001"
      - "127.0.0.1:9223:9223"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Los_Angeles
      LAUNCH_URL: about:blank
      TITLE: chrome-cell
    volumes:
      - ./config:/config
    restart: unless-stopped

  gateway:
    build: ./gateway
    image: ghcr.io/peterrauscher/chrome-cell-gateway:local
    ports:
      - "8080:8080"
    environment:
      NUM_CELLS: "1"
      CELL_HOST_TEMPLATE: chrome-cell
      CELL_VNC_PORT: "3000"
      CELL_CDP_PORT: "9223"
    depends_on:
      - chrome-cell
    restart: unless-stopped
