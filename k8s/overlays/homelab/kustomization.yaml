apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - nodeports.yaml
  - secret.example.yaml

patches:
  - path: patch-ui-auth.yaml

# Pin the image you actually built. Override at apply time with
#   kubectl apply -k k8s/overlays/homelab
# or
#   kustomize edit set image ghcr.io/peterrauscher/chrome-cell:SHA
images:
  - name: ghcr.io/peterrauscher/chrome-cell
    newTag: latest
