apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chrome-cell
  labels:
    app.kubernetes.io/name: chrome-cell
spec:
  serviceName: chrome-cell
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: chrome-cell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chrome-cell
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: Unconfined
      containers:
        - name: chrome
          image: ghcr.io/peterrauscher/chrome-cell:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: chrome-cell
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - name: ui-http
              containerPort: 3000
            - name: ui-https
              containerPort: 3001
            - name: cdp
              containerPort: 9223
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: ui-https
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ui-https
            initialDelaySeconds: 40
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: true
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: chrome-cell
                topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
